[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thinwrap-location"
version = "1.3.0"
description = "Lightweight, SDK-free, zero-dependency Python wrapper for routing, distance matrix, geocoding, and isochrone across Google, Mapbox, HERE, ESRI, TomTom, and OSRM."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dmitry Polyanovsky" }]
keywords = ["routing", "geocoding", "isochrone", "distance-matrix", "maps", "google", "mapbox", "here", "esri", "tomtom", "osrm"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.urls]
Homepage = "https://thinwrap.dev"
Repository = "https://github.com/thinwrap/location-py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["thinwrap.location*"]
namespaces = true

# Explicit so the PEP 561 marker ships whatever setuptools the build resolves,
# rather than relying on a default.
[tool.setuptools.package-data]
"thinwrap.location" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
